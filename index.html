<!DOCTYPE html>
<html lang="en">
<head>
    <title>Guess & Learn! - Educational Games for Kids</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Interactive educational games for children to learn colors, numbers, animals, and more!">
    
    <!-- Bootstrap 3.4.1 (conservé comme dans l'original) -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    
    <!-- Vendor CSS Files (conservés comme dans l'original) -->
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="vendor/aos/aos.css" rel="stylesheet">
    <link href="vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
    <link href="vendor/swiper/swiper-bundle.min.css" rel="stylesheet">

    <!-- Google Fonts pour une typographie adaptée aux enfants -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">
    
    <style>
        /* Variables CSS pour une cohérence */
        :root {
            --primary-color: #4e54c8;
            --secondary-color: #8f94fb;
            --accent-color: #ff6b6b;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --success-color: #51e951;
            --warning-color: #FF5722;
            --background-color: #44c2e9;
        }
        
        /* Styles de base */
        body {
            font-family: 'Comic Neue', cursive, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: var(--dark-color);
        }
        
        /* Logo */
        #logo2 {
            margin-top: 10px;
            margin-left: 50px;
            width: 100px;
            border-radius: 50%;
        }
        
        /* Section de bienvenue */
        #welcome {
            background-color: var(--background-color);
            padding: 2rem 0;
        }
        
        .animated-title {
            font-family: 'Fredoka One', cursive;
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            animation: slideIn 2s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Grille de jeux améliorée */
        #game {
            margin-left: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 0 1rem;
        }
        
        /* Cartes de jeu avec effet de survol */
        .game-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        
        /* Styles originaux conservés pour la fonctionnalité */
        .imag-containe {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .imggame {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            display: block;
        }
        
        .over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 10px;
        }
        
        .overlay-button {
            font-size: 16px;
            background-color: rgba(25, 39, 235, 0.7);
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .overlay-button:hover {
            background-color: rgba(62, 218, 88, 0.9);
        }
        
        /* Zone de jeu - MODIFICATION IMPORTANTE */
        #div4 {
            padding: 20px;
            margin-top: 50px;
            background-color: var(--background-color);
            background-size: cover;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        /* Styles pour les jeux - TOUS CONSERVÉS */
        .animalslist, .colorslist, .numberslist {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            width: 100%;
        }
        
        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 150px;
            margin: 10px;
            transition: transform 0.3s ease;
        }
        
        .column:hover {
            transform: scale(1.1);
        }
        
        .animalname, .colorname, .numbername {
            margin-top: 10px;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
            color: var(--dark-color);
        }
        
        .btn-space {
            margin: 5px;
            border-radius: 8px;
            background-color: rgb(231, 182, 177);
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-space:hover {
            background-color: rgb(218, 160, 154);
        }
        
        .color, .color1 {
            width: 100px;
            height: 100px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .color:hover, .color1:hover {
            transform: scale(1.05);
        }
        
        .color1 {
            margin-left: 0; /* MODIFICATION: Suppression du margin-left excessif */
        }
        
        .colorguess, .guess, .guess1 {
            width: 100px;
            height: 50px;
            margin: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .guess, .guess1 {
            background-color: var(--success-color);
            border-radius: 30px;
        }
        
        .guess1 {
            width: 150px;
        }
        
        .colorguess:hover, .guess:hover, .guess1:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        
        .answer {
            margin-top: 30px;
            background-color: white;
            border-radius: 20px;
            width: 38%;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .correct {
            color: var(--success-color);
            font-size: large;
            font-family: fantasy;
            margin: 10px 0;
        }
        
        .wrong {
            color: var(--warning-color);
            font-size: large;
            font-family: fantasy;
            margin: 10px 0;
        }
        
        .titleh1, .titleh2, .titleh3 {
            margin: 20px 0;
            color: var(--warning-color);
            font-weight: 1000;
            text-align: center;
            width: 100%; /* MODIFICATION: Assurer la largeur complète pour le centrage */
        }
        
        .titleh1 {
            margin-left: 0; /* MODIFICATION: Suppression du margin-left excessif */
        }
        
        .titleh2 {
            margin-left: 0; /* MODIFICATION: Suppression du margin-left excessif */
        }
        
        .titleh3 {
            margin-left: 0; /* MODIFICATION: Suppression du margin-left excessif */
        }
        
        /* Bouton de retour en haut */
        #scrollToTopBtn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        #scrollToTopBtn:hover {
            background: var(--accent-color);
            transform: scale(1.1);
        }
        
        /* Pied de page */
        footer {
            background: var(--dark-color);
            color: white;
            padding: 2rem 0;
            text-align: center;
        }
        
        footer h3 {
            font-family: 'Fredoka One', cursive;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }
        
        .social-links {
            margin: 1.5rem 0;
        }
        
        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            margin: 0 0.5rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .social-links a:hover {
            background: var(--accent-color);
            transform: translateY(-5px);
        }
        
        .copyright {
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .credits {
            font-size: 13px;
            padding-top: 5px;
        }
        
        .credits a {
            color: var(--accent-color);
            text-decoration: none;
        }
        
        .credits a:hover {
            text-decoration: underline;
        }
        
        /* Animations - TOUTES CONSERVÉES */
        #animationContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
        
        .star, .flower {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: fadeInOut 2s ease-in-out forwards;
        }
        
        .star {
            width: 10px;
            height: 10px;
            background-color: gold;
            box-shadow: 0 0 10px gold, 0 0 20px yellow;
        }
        
        .flower {
            width: 15px;
            height: 15px;
            background-color: pink;
            box-shadow: 0 0 10px pink, 0 0 20px lightpink;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 30px;
            opacity: 0;
            transform: rotate(45deg);
            animation: fallConfetti 3s ease-in-out forwards;
        }
        
        .circle {
            position: absolute;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.7);
            animation: expandCircle 1s ease-out forwards;
        }
        
        @keyframes fadeInOut {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.5);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }
        
        @keyframes fallConfetti {
            0% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes expandCircle {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }
        
        /* Responsive design */
        @media screen and (max-width: 768px) {
            #logo2 {
                margin-top: 8px;
                margin-left: 20px;
                width: 80px;
            }
            
            .animated-title {
                font-size: 2rem;
            }
            
            #game {
                margin-left: 0;
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1rem;
            }
            
            .imggame {
                width: 100%;
                height: 200px;
            }
            
            .over {
                flex-direction: column;
            }
            
            .titleh1, .titleh2, .titleh3 {
                margin-left: 0;
            }
            
            .color1 {
                margin-left: 0; /* MODIFICATION: Suppression du margin-left excessif */
            }
            
            .answer {
                width: 90%; /* MODIFICATION: Adaptation pour mobile */
            }
        }
        
        @media screen and (max-width: 480px) {
            #logo2 {
                margin-top: 5px;
                margin-left: 10px;
                width: 60px;
            }
            
            .animated-title {
                font-size: 1.8rem;
            }
            
            #game {
                margin-left: 0;
                grid-template-columns: 1fr;
            }
            
            .imggame {
                width: 100%;
                height: 150px;
            }
            
            .color1 {
                margin-left: 0; /* MODIFICATION: Suppression du margin-left excessif */
            }
            
            .answer {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div id="welcome">
        <div class="row">
            <div class="col-lg-12">
                <img id="logo2" src="./img/guessandlearn.png" alt="Guess and Learn Logo">
                <h1 class="animated-title">Welcome to Guess and Learn!</h1>

        <div id="game">

            <div class="game-card">

            <!-- Shapes Game Card -->
            <div class="game-card">

            <!-- Vegetables Game Card -->
            <div class="game-card">
                <a href="#div4">

                            <button class="overlay-button" onclick="myGameVegetable.displayGame()">Play</button>

            <!-- Clothes Game Card -->
            <div class="game-card">
                <a href="#div4">
                    <div class="imag-containe">
                        <img class="imggame" src="./img/clothes/clothes.png" alt="Clothes">
                        <div class="over">
                            <button class="overlay-button" onclick="myGameClothe.displayGame()">Play</button>
                            <button class="overlay-button" onclick="displayClothes()">Learn</button>
                        </div>
                    </div>
                </a>
            </div>
            
            <!-- Body Game Card -->
            <div class="game-card">
                <a href="#div4">
                    <div class="imag-containe">
                        <img class="imggame" src="./img/body/mybody.png" alt="MyBody">
                        <div class="over">

                            <button class="overlay-button" onclick="displayBody()">Learn</button>

            <!-- Jobs Game Card -->
            <div class="game-card">
                <a href="#div4">
                    <div class="imag-containe">
                        <img class="imggame" src="./img/jobs/jobs.png" alt="Jobs">
                        <div class="over">
                            <button class="overlay-button" onclick="myGameJob.displayGame()">Play</button>

            <!-- Letters Game Card -->

    <div id="div4">
        <!-- Le contenu des jeux sera affiché ici -->
    </div>

    </footer>
    
    <!-- Tous les scripts JavaScript conservés -->
    <script type="text/javascript" src="main.js"></script>
